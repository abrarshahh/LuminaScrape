# LuminaScrape Model Configuration
# Use LiteLLM prefixes:
# - Local: ollama/llama3.2
# - OpenAI: gpt-4o-mini
# - Anthropic: claude-3-5-sonnet-20240620
# - Google: gemini/gemini-1.5-pro

agents:
  pilot:
    model: "ollama/llama3.2-vision"
    temperature: 0.0
    description: "The Preparer Agent responsible for visual analysis and blockade busting."
  
  extractor:
    model: "groq/llama-3.3-70b-versatile"
    temperature: 0.0
    description: "Primary heavy extraction model for robust structured output."

  overseer:
    model: "groq/llama-3.1-8b-instant"
    temperature: 0.0
    description: "Quality control and routing model (retry_extract vs navigate)."
  
  schema_generator:
    model: "groq/llama-3.3-70b-versatile"
    temperature: 0.0
    description: "Generates a consistent JSON output schema from a user prompt."
  
  navigator:
    model: "groq/llama-3.1-8b-instant"
    temperature: 0.0
    description: "Decides whether to extract, scroll, or navigate to reach the correct page."

  multipage_selector:
    model: "groq/llama-3.1-8b-instant"
    temperature: 0.0
    description: "Selects best candidate detail URLs for multi-page extraction."

global_settings:
  fallback_model: "ollama/deepseek-r1:8b" # Safe local fallback for GPU-limited machines
  enable_fallbacks: true
